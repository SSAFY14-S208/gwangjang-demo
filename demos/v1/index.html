<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>네모닉 월드</title>
    <link rel="icon" href="data:," />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="viewer-shell">
        <header class="viewer-copy">
          <p class="eyebrow">인터랙티브 오브젝트</p>
          <h1>네모닉 월드</h1>
          <p class="description">
            가운데 오브젝트를 좌우로 드래그해 돌려보고, 마우스 휠로 확대하거나 축소해보세요.
            아래 색상 버튼을 누르면 해당 파트가 정면으로 이동합니다.
          </p>
        </header>
        <main class="viewer-stage">
          <canvas id="scene"></canvas>
        </main>
        <footer class="viewer-controls">
          <div class="platform-buttons" aria-label="색상 파트 보기">
            <button class="platform-button" data-angle="-2.794" data-platform="green" type="button">
              초록
            </button>
            <button class="platform-button" data-angle="1.679" data-platform="purple" type="button">
              보라
            </button>
            <button class="platform-button is-active" data-angle="0.51" data-platform="coral" type="button">
              코랄
            </button>
            <button class="platform-button" data-angle="-0.904" data-platform="blue" type="button">
              파랑
            </button>
            <button class="platform-button" data-angle="-1.645" data-platform="yellow" type="button">
              노랑
            </button>
          </div>
          <div class="viewer-hint">
            <span>좌우 드래그</span>
            <span>휠 줌</span>
            <span>Y축 고정</span>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
