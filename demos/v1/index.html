<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>네모닉 월드</title>
    <link rel="icon" href="data:," />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="viewer-shell">
        <header class="viewer-copy">
          <p class="eyebrow">하루에 한 번, 네모닉 운세</p>
          <h1>오늘의 운세</h1>
          <p class="description">
            생년월일시를 넣고 네모닉이 건네는 오늘의 운세 카드를 받아보는 작은 부스입니다.
          </p>
        </header>
        <main class="viewer-stage">
          <canvas id="scene"></canvas>
        </main>
        <footer class="viewer-controls">
          <div class="platform-buttons" aria-label="콘텐츠 보기">
            <button class="platform-button" data-angle="-2.794" data-content="community" data-platform="green" type="button">
              커뮤니티
            </button>
            <button class="platform-button is-active" data-angle="1.679" data-content="fortune" data-platform="purple" type="button">
              운세
            </button>
            <button class="platform-button" data-angle="0.51" data-content="relay" data-platform="coral" type="button">
              릴레이
            </button>
            <button class="platform-button" data-angle="-0.904" data-content="infinite" data-platform="blue" type="button">
              무한
            </button>
            <button class="platform-button" data-angle="-1.645" data-content="flipbook" data-platform="yellow" type="button">
              플립북
            </button>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
