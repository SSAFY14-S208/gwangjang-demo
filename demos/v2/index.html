<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemonic World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="viewer-shell">
        <header class="viewer-copy">
          <p class="eyebrow">Fantasy Park Diorama</p>
          <h1>
            <span>Nemonic</span>
            <span>World</span>
          </h1>
          <p class="description">
            솜사탕 하늘과 무지개 아치 아래, 메모와 드로잉, 포춘 메모가 이어지는 네모닉 테마파크
            월드입니다.
          </p>
        </header>

        <main class="viewer-stage">
          <canvas id="scene" aria-label="놀이공원 테마의 네모닉 월드 장면"></canvas>

          <aside class="focus-readout" aria-live="polite">
            <p class="focus-kicker">Current Focus</p>
            <h2 id="focus-title">레인보우 광장</h2>
            <p class="focus-meta" id="focus-meta">Fantasy Hub</p>
            <p class="focus-description" id="focus-description">
              중앙 광장이 무지개 캐노피와 캔디 조명 아래에서 각 존으로 이어지는 축제형 허브로
              확장됩니다.
            </p>
          </aside>
        </main>

        <footer class="viewer-controls">
          <div class="platform-buttons" aria-label="Zone viewpoints">
            <button class="platform-button" data-focus="entry" type="button">입구</button>
            <button class="platform-button is-active" data-focus="plaza" type="button">광장</button>
            <button class="platform-button" data-focus="community" type="button">커뮤니티</button>
            <button class="platform-button" data-focus="relay" type="button">릴레이</button>
            <button class="platform-button" data-focus="fortune" type="button">포춘 메모</button>
          </div>

          <div class="viewer-hint">
            <span>드래그로 둘러보기</span>
            <span>휠로 확대·축소</span>
            <span>버튼으로 존 포커스</span>
          </div>
        </footer>
      </div>
    </div>
  </body>
</html>
